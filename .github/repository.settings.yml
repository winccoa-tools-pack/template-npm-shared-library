# Repository settings applied via GitHub REST API by .github/workflows/apply-settings-and-rulesets.yml
# This repo uses GitFlow: develop is default, main is stable release.

description: "The template for WinCC OA NPM packages"
homepage: "https://github.com/winccoa-tools-pack"
default_branch: "develop"

has_issues: true
has_wiki: false

allow_squash_merge: true
allow_merge_commit: true
allow_rebase_merge: false
allow_auto_merge: true

delete_branch_on_merge: true

topics:
  - winccoa
  - wincc-oa
  - vscode
  - automation
  - npm
  - scada
  - hmi
  - industrial-automation
  - Siemens
  - ETM

security:
  enable_vulnerability_alerts: true
  enable_automated_security_fixes: true

# Configuration for the manual "Approve Open PR Workflows" action.
# Placing settings here keeps configuration with repository-managed settings.
auto_approve:
  dependabot_only: true
  # List workflow names to target; empty list means any workflow triggered by PRs.
  workflows:
    - "CI/CD Pipeline"
    - "Git Flow Validation"
    - "PR Labels"

# Actions permissions: control which actions are allowed to run in this repository.
# Setting `allowed_actions: all` permits all GitHub Actions and third-party actions.
# Use `selected` + `selected_actions.apps` to restrict to specific GitHub Apps if desired.
actions_permissions:
  enabled: true
  allowed_actions: all
