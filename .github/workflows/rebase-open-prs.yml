name: Rebase open PRs

on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

  # allow commenting on PRs and updating workflow files when needed
  issues: write
  
jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: mPokornyETM/rebase-open-prs-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-drafts: 'true'                    # Skip draft PRs (default: true)
          skip-dependabot-rebase: 'true'         # Use @dependabot rebase comment (default: true)
