# Auto-enable squash merge for Dependabot PRs
# GitHub will automatically merge once all required checks pass
name: Dependabot Auto-merge (conservative)

on: pull_request

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Debug show event actor
        run: |
          echo "github.actor=${{ github.actor }}"
          echo "event_name=${{ github.event_name }}"
          echo "GITHUB_EVENT_PATH=$GITHUB_EVENT_PATH"
      - name: Fetch Dependabot metadata
        if: ${{ startsWith(github.actor, 'dependabot') }}
        id: metadata
        uses: dependabot/fetch-metadata@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure dependabot/patch label exists
        if: ${{ startsWith(github.actor, 'dependabot') }}
        run: |
          if ! gh label view "dependabot/patch" >/dev/null 2>&1; then
            gh label create "dependabot/patch" --color bfe5bf --description "Dependabot patch updates"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add patch label
        if: ${{ startsWith(github.actor, 'dependabot') && steps.metadata.outputs['update-type'] == 'version-update:semver-patch' }}
        run: gh pr edit "$PR_URL" --add-label "dependabot/patch"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update branch if behind
        if: ${{ startsWith(github.actor, 'dependabot') }}
        run: gh pr update-branch --rebase "$PR_URL" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug show metadata outputs
        if: ${{ startsWith(github.actor, 'dependabot') }}
        run: |
          echo "dependabot metadata:"
          echo "  update-type=${{ steps.metadata.outputs['update-type'] }}"
          echo "  package-ecosystem=${{ steps.metadata.outputs['package-ecosystem'] }}"
          echo "  directory=${{ steps.metadata.outputs['directory'] }}"

      - name: Approve Dependabot patch PR
        if: ${{ startsWith(github.actor, 'dependabot') && steps.metadata.outputs['update-type'] == 'version-update:semver-patch' }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash) for patch updates
        if: ${{ startsWith(github.actor, 'dependabot') && steps.metadata.outputs['update-type'] == 'version-update:semver-patch' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
