# Auto-enable squash merge for Dependabot PRs
# GitHub will automatically merge once all required checks pass
name: Dependabot Auto-merge (conservative)

on: pull_request

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' || github.actor == 'github-actions[bot]' }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Debug show event actor
        run: |
          echo "github.actor=${{ github.actor }}"
          echo "event_name=${{ github.event_name }}"
          echo "GITHUB_EVENT_PATH=$GITHUB_EVENT_PATH"
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure dependabot/patch label exists
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          echo "Checking label in $REPO"
          if ! gh label view "dependabot/patch" --repo "$REPO" >/dev/null 2>&1; then
            echo "Label not found; creating dependabot/patch"
            # Use the REST API to create label (more explicit and robust)
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/labels" \
              -f name='dependabot/patch' \
              -f color='bfe5bf' \
              -f description='Dependabot patch updates' || true
          else
            echo "Label exist: dependabot/patch"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

      - name: Add patch label
        if: ${{ startsWith(github.actor, 'dependabot') && (steps.metadata.outputs['update-type'] == 'version-update:semver-patch' || steps.metadata.outputs['update-type'] == 'version-update:semver-minor') }}
        run: gh pr edit "$PR_URL" --add-label "dependabot/patch"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update branch if behind
        run: gh pr update-branch --rebase "$PR_URL" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug show metadata outputs
        run: |
          echo "dependabot metadata:"
          echo "  update-type=${{ steps.metadata.outputs['update-type'] }}"
          echo "  package-ecosystem=${{ steps.metadata.outputs['package-ecosystem'] }}"
          echo "  directory=${{ steps.metadata.outputs['directory'] }}"

      - name: Approve Dependabot patch PR
        if: ${{ steps.metadata.outputs['update-type'] == 'version-update:semver-patch' || steps.metadata.outputs['update-type'] == 'version-update:semver-minor' }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (squash) for patch updates
        if: ${{ steps.metadata.outputs['update-type'] == 'version-update:semver-patch' || steps.metadata.outputs['update-type'] == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
