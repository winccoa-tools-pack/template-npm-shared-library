name: "Main (stable) branch protection"
target: "branch"
# Release and hotfix PRs must keep their history: merge commits only.
enforcement: "active"

conditions:
  ref_name:
    include:
      - "refs/heads/main"
    exclude: []

rules:
  - type: "non_fast_forward"
    parameters: {}

  - type: "deletion"
    parameters: {}

  - type: "pull_request"
    parameters:
      required_approving_review_count: 1
      dismiss_stale_reviews_on_push: true
      require_code_owner_review: false
      require_last_push_approval: false
      required_review_thread_resolution: true
      allowed_merge_methods:
        - "merge"

  - type: "required_status_checks"
    parameters:
      strict_required_status_checks_policy: true
      required_status_checks:
        - context: "CI/CD Pipeline - Required"
        - context: "PR Labels - Required"
        - context: "Git Flow Validation - Required"

# Allow organization admins to bypass the PR review requirement (but keep other protections).
bypass_actors:
  - actor_id: 1
    actor_type: "OrganizationAdmin"
    bypass_mode: "pull_request"
